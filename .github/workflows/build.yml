name: Reproducible builds
run-name: ${{ github.actor }} is building 🚀
on:
  push:
    branches: ['**']
    tags: ['v*']
jobs:
  Build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: cd dist && sha256sum trezorctl | tee trezorctl.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/trezorctl dist/trezorctl.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "sha256: \`$(cut -d' ' -f1 dist/trezorctl.sha256)\`"
